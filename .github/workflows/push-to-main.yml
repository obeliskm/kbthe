
# workflow run when a push to main occurs

# this isn't remotely realistic, it's just a placeholder.  The actual deploy process
# for a dag depends on
# - how the test/production instances of airflow are deployed - if it's a cloud managed
# instance (eg AWS MWAA), then it's likely that the dag is deployed by dropping the DAG
# file into a specific S3 bucket, self managed airflow instances may have different
# processes
# - the environment where the dag is deployed - the workflow should be environment aware,
# and run integration tests in a test environment before deploying to production
# 
name: Deploy Airflow DAG

on:
  push:
    branches:
      - main

jobs:
  deploy-airflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Start Airflow with Docker
        run: |
          docker-compose up -d  # Start Airflow containers defined in a docker-compose.yml file

      - name: Trigger Airflow DAG
        run: |
          docker exec -ti <airflow-webserver-container> airflow dags trigger KBTHE_dag

      - name: Clean up
        run: |
          docker-compose down  # Stop and remove Airflow containers
